<style>
/* v4: pagos de contado o en cuotas (Cashea) y comisión al cambiar USDT */
/* Libreta de bolsillo para el mercado: una columna en el celular, barra de mes fija arriba,
   pestañas abajo (lateral en pantallas grandes) y hojas inferiores para registrar compras. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#E7EDEB; --ink:#12201E; --muted:#566864; --line:#D7E0DD;
  --accent:#0A6B58; --on-accent:#FFFFFF; --accent-tint:#CFE8E0;
  --bs:#8A5A12; --bs-bg:#F6E8CF; --usdt:#0B7A5E; --usdt-bg:#DDF1EA; --bcv:#2D56B8; --bcv-bg:#E1E9FA;
  --ok:#0B7A5E; --ok-bg:#DDF1EA; --warn:#8F5200; --warn-bg:#FBEBCF; --bad:#B3261E; --bad-bg:#F9DEDB; --idle:#566864; --idle-bg:#E7EDEB;
  --scrim:rgb(8 20 18 / .5); --shadow:0 1px 2px rgb(18 32 30 / .08),0 8px 24px rgb(18 32 30 / .08);
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'Spline Sans Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-card:14px; --r-btn:11px; --r-in:10px; --r-sheet:18px; --r-md:12px; --r-seg:8px;
  --gap:14px; --cpy:14px; --cpx:16px; --rpy:12px; --rpx:14px; --spy:10px;
  --app-name:"Compras del Mes";
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#142120; --surface2:#1D2E2B; --ink:#E4EEEB; --muted:#93A8A3; --line:#26393A;
    --accent:#3FC3A1; --on-accent:#05221B; --accent-tint:#1B4A40;
    --bs:#F0C27A; --bs-bg:#3A2D14; --usdt:#4CCFAA; --usdt-bg:#16342D; --bcv:#8FB0FF; --bcv-bg:#1B2A4D;
    --ok:#4CCFAA; --ok-bg:#16342D; --warn:#F0B35A; --warn-bg:#3A2B10; --bad:#FF8F85; --bad-bg:#43201D; --idle:#93A8A3; --idle-bg:#1D2E2B;
    --scrim:rgb(0 0 0 / .62); --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#142120; --surface2:#1D2E2B; --ink:#E4EEEB; --muted:#93A8A3; --line:#26393A;
  --accent:#3FC3A1; --on-accent:#05221B; --accent-tint:#1B4A40;
  --bs:#F0C27A; --bs-bg:#3A2D14; --usdt:#4CCFAA; --usdt-bg:#16342D; --bcv:#8FB0FF; --bcv-bg:#1B2A4D;
  --ok:#4CCFAA; --ok-bg:#16342D; --warn:#F0B35A; --warn-bg:#3A2B10; --bad:#FF8F85; --bad-bg:#43201D; --idle:#93A8A3; --idle-bg:#1D2E2B;
  --scrim:rgb(0 0 0 / .62); --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.9375rem;line-height:1.45;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h2{font-size:1.05rem;font-weight:650;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}

.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px}
.month{display:flex;align-items:center;gap:4px;flex:none}
.mlabel{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.mlabel strong{font-size:1.15rem;font-weight:650;line-height:1.15;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:550;text-decoration:underline;text-underline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon:active{background:var(--surface2)}
.status{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;line-height:1.2;text-align:right}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.status.saving i{background:var(--warn)}
.status.error i{background:var(--bad)}

.stack{display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--cpy) var(--cpx);min-width:0}
.card>h2{margin-bottom:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.hero{padding-block:6px 2px}
.hero .lbl{font-size:.8rem;color:var(--muted);font-weight:550;text-transform:uppercase;letter-spacing:.06em}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-block:2px 4px}
.big .num{font-size:clamp(2.3rem,11vw,3.1rem);font-weight:500;line-height:1.05;overflow-wrap:anywhere}
.big .unit{font-family:var(--font-num);font-size:.9rem;color:var(--muted)}
.hero-sub{font-size:.88rem;color:var(--muted)}
.hero-sub b{color:var(--ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.stat{padding:var(--rpy) var(--rpx);min-width:0;background:var(--surface)}
.stat:last-child{grid-column:span var(--sp-m,1)}
.stat .sub{display:block;font-size:.72rem;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.stat .lbl{font-size:.74rem;color:var(--muted);font-weight:550}
.stat .num{display:block;font-size:.98rem;font-weight:500;margin-top:2px;overflow-wrap:anywhere}

.notice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid transparent;border-radius:var(--r-md);padding:11px 13px;font-size:.88rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice b{font-weight:650}

.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-in);padding:3px;gap:2px;position:relative;flex-wrap:wrap}
.seg label,.seg button{position:relative;margin:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span,.seg button{display:block;border:0;background:transparent;border-radius:var(--r-seg);padding:7px 14px;font-size:.85rem;font-weight:550;color:var(--muted);min-height:34px}
.seg input:checked+span,.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg.small span,.seg.small button{padding:4px 10px;font-size:.78rem;min-height:28px}
.seg.full{display:flex}.seg.full>*{flex:1}.seg.full button{text-align:center;padding-inline:6px}
.seg.full label span{text-align:center;padding-inline:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}
.cur{font-family:var(--font-num);font-size:.68rem;font-weight:600;border-radius:6px;padding:1px 6px;letter-spacing:.03em;white-space:nowrap}
.cur.Bs{background:var(--bs-bg);color:var(--bs)}
.cur.USDT{background:var(--usdt-bg);color:var(--usdt)}
.cur.BCV{background:var(--bcv-bg);color:var(--bcv)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.who{display:inline-flex;align-items:center;gap:5px}

.cat-row{display:flex;flex-direction:column;gap:5px;padding-block:8px}
.cat-row+.cat-row{border-top:1px solid var(--line)}
.cat-top{display:flex;align-items:center;gap:8px;min-width:0}
.cat-top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-top .num{font-size:.9rem}
.cat-top .pc{font-size:.76rem;color:var(--muted);width:3.2em;text-align:right}
.cat-eq{font-family:var(--font-num);font-size:.74rem;color:var(--muted);padding-left:18px}
.track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:3px}

/* gráfico por día */
.readout{font-size:.84rem;color:var(--muted);min-height:1.4em;margin-bottom:6px}
.readout b{color:var(--ink);font-weight:550}
.dchart{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:2px;height:120px;align-items:end;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat}
.dbar{height:100%;display:flex;align-items:flex-end;border:0;background:none;padding:0;min-width:0}
.dbar i{display:block;width:100%;height:var(--h);min-height:2px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}
.dbar.zero i{background:var(--line);opacity:1;height:2px}
.dbar.today i{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.dbar.sel i{background:var(--ink);opacity:1}
.dlab{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:2px;margin-top:4px}
.dlab span{font-size:.66rem;color:var(--muted);text-align:center;font-family:var(--font-num);white-space:nowrap;overflow:visible}
.dmax{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-family:var(--font-num);margin-bottom:4px}
.donut{display:block;width:min(220px,70%);height:auto;margin:4px auto 10px}
.ch-big{fill:var(--ink);font-family:var(--font-num);font-size:15px;font-weight:500}
.ch-sm{fill:var(--muted);font-family:var(--font-num);font-size:7.5px}
.ch-li{display:flex;align-items:center;gap:8px;padding-block:5px;min-width:0}
.ch-li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-li .num{font-size:.86rem}
.ch-li .pc{font-size:.76rem;color:var(--muted);width:3.2em;text-align:right}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-btn);border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.95rem}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad-bg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn:disabled{opacity:.5}
.btn.block{width:100%}

.list{padding:0}
.list .row{display:flex;align-items:center;gap:12px;padding:var(--rpy) var(--rpx);width:100%;text-align:left;background:transparent;border:0;color:inherit;min-width:0}
.list .row+.row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-weight:560;overflow-wrap:anywhere}
.row .t2{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.row .t3{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;max-width:46%}
.row .amt .num{font-size:.95rem;font-weight:500;overflow-wrap:anywhere}
.row .amt .eq{font-family:var(--font-num);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:550;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:var(--muted);font-weight:500;font-size:.72rem}
.chip.on small{color:inherit;opacity:.75}
.total-line{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.total-line .num{font-size:1.25rem;font-weight:500}
.total-line .tl-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.total-line .tl-r .eq{font-family:var(--font-num);font-size:.72rem;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.sec-pad{padding:var(--cpy) var(--cpx);margin:0}
.sub-h{font-size:.78rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 6px}
.loading{padding:30px 0;color:var(--muted);text-align:center}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:var(--spy)}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.set-row .sub{display:block;font-size:.78rem;color:var(--muted)}
.example{font-family:var(--font-num);font-size:.84rem;color:var(--muted);margin-top:8px}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld>span em{font-style:normal;font-weight:400}
.fld-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld.grow{flex:1;min-width:8em}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-in);padding:11px 12px;font-size:max(16px,1rem);color:var(--ink)}
input[type=date]{min-height:46px}
textarea{resize:vertical;min-height:70px}
.err{color:var(--bad);font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
details.own{border:1px dashed var(--line);border-radius:var(--r-in);padding:9px 12px}
details.own summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
details.own summary em{font-style:normal;font-weight:400}
details.own .fld,details.own .fld-row{margin-top:10px}
.check{display:flex;align-items:center;gap:10px;font-size:.9rem}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.cs-prev{background:var(--accent-tint);color:var(--ink);border-radius:var(--r-in);padding:10px 12px;font-size:.86rem;min-height:2.6em}
.cs-prev .num{font-weight:500}
.cs-prev .warnx{color:var(--bad);font-weight:550}
.cs-prev .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding-block:2px}
.cs-prev .l span:first-child{color:var(--muted)}
.cs-prev .l span:last-child{font-family:var(--font-num)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:550;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,calc((100vw - 560px) / 2 + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab:disabled{opacity:.45}

.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet form,.sheet .col{display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.15rem}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(138px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none!important}}

/* personalización */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}
.opt b{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.opt small{color:var(--muted);font-size:.78rem;line-height:1.3}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-tint)}
.sw-grid{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw-btn{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .18);padding:0;flex:none}
.sw-btn.on{border-color:var(--bg);box-shadow:0 0 0 2px var(--ink)}
input[type=color]{width:46px;height:36px;padding:2px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--surface);flex:none}
.tone-prev{display:flex;height:16px;border-radius:5px;overflow:hidden;border:1px solid rgb(0 0 0 / .15);margin-bottom:6px}
.tone-prev i{flex:1}
.blq{display:flex;align-items:center;gap:8px;padding-block:8px}
.blq+.blq{border-top:1px solid var(--line)}
.blq .nm{flex:1;min-width:0}
.ico-b{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.ico-b:disabled{opacity:.3}
.lbl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.welcome{background:var(--accent-tint);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.welcome h2{font-size:1.05rem}
.font-opt .smp{font-size:1.05rem;line-height:1.25}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 140px;width:auto}
.addrow select{flex:0 0 auto;width:auto}
.catname{display:flex;align-items:center;gap:10px;min-width:0}
.catname .dot{width:12px;height:12px}

@media (hover:hover){
  .list .row:hover{background:var(--surface2)}
  .btn:hover{filter:brightness(1.07)}
  .btn.line:hover,.btn.ghost:hover{background:var(--surface2);filter:none}
  .chip:hover{border-color:var(--muted)}
  .tab:hover{color:var(--ink)}
  .icon:hover{background:var(--surface2)}
  .dbar:hover i{opacity:1}
}
@media (min-width:700px){
  .app{max-width:720px}
  .overlay{align-items:center;padding:16px}
  .sheet{max-width:600px;max-height:88vh;border-radius:var(--r-sheet);animation:pop .16s ease-out}
  .toast{bottom:32px}
  .fab{bottom:32px}
}
@media (min-width:1000px){
  body{font-size:.96875rem}
  .app{max-width:none;margin:0 0 0 232px;padding:0 clamp(28px,4vw,64px) 90px}
  .app>*{max-width:1120px;margin-inline:auto}
  .top{padding-block:18px 14px}
  .tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .tabs::before{content:var(--app-name);display:block;padding:26px 22px 14px;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
  .tabs-in{max-width:none;margin:0;display:flex;flex-direction:column;gap:2px;padding:6px 12px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:11px 14px;border-radius:10px}
  .tab[aria-current="page"]{background:var(--accent-tint);color:var(--accent)}
  .fab{right:40px;bottom:36px;width:auto;height:52px;border-radius:26px;padding:0 22px 0 16px;gap:8px;display:flex;align-items:center}
  .fab::after{content:"Agregar compra";font-size:.95rem;font-weight:600}
  .toast{left:calc(50% + 116px)}
  #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #view>*{grid-column:1/-1}
  #view>.half{grid-column:auto}
  .stats{grid-template-columns:repeat(var(--dc,4),minmax(0,1fr))}
  .stat:last-child{grid-column:span var(--sp-d,1)}
  .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible}
  .sheet{max-width:640px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view" class="stack"></main>
</div>

<button class="fab" id="fab" data-a="fab" aria-label="Agregar compra" disabled>
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs">
  <button class="tab" data-a="tab" data-t="resumen"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span class="tl" data-l="t_resumen">Resumen</span></button>
  <button class="tab" data-a="tab" data-t="compras"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.7a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg><span class="tl" data-l="t_compras">Compras</span></button>
  <button class="tab" data-a="tab" data-t="cats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span class="tl" data-l="t_cats">Categorías</span></button>
  <button class="tab" data-a="tab" data-t="ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span class="tl" data-l="t_ajustes">Ajustes</span></button>
</div></nav>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return String(n).padStart(2,'0')};

function curs(){return ['Bs'].concat(CFG.mon.showBcv?['BCV']:[],CFG.mon.showUsdt?['USDT']:[])}
function cname(c){return c==='BCV'?CFG.mon.bcv:c==='USDT'?CFG.mon.usdt:CFG.mon.bs}

function rateOf(fecha,key){
  var best=null;
  DATA.tasas.forEach(function(t){var f=t.fecha||t.id; if(f<=fecha&&Number(t[key])>0&&(!best||f>best.f)) best={f:f,v:Number(t[key])}});
  return best;
}
function exactTasa(fecha){return DATA.tasas.filter(function(t){return (t.fecha||t.id)===fecha})[0]||null}
function convert(total,moneda,rb,ru){
  var bs=null;
  if(moneda==='Bs') bs=total; else if(moneda==='BCV'&&rb>0) bs=total*rb; else if(moneda==='USDT'&&ru>0) bs=total*ru;
  var bcv=moneda==='BCV'?total:(bs!=null&&rb>0?bs/rb:null);
  var usdt=moneda==='USDT'?total:(bs!=null&&ru>0?bs/ru:null);
  return {bs:bs,bcv:bcv,usdt:usdt};
}
function facById(id){if(!id) return null;for(var i=0;i<DATA.facturas.length;i++) if(DATA.facturas[i].id===id) return DATA.facturas[i]; return null}
function resolved(c){
  var f=c.factura?facById(c.factura):null; if(!f) return c;
  return Object.assign({},c,{fecha:f.fecha,comprador:f.comprador,lugar:f.lugar||''});
}
function ratesFor(c){
  var f=c.factura?facById(c.factura):null,rb=0,ru=0;
  if(f&&Number(f.bcv)>0) rb=Number(f.bcv);
  if(f&&Number(f.usdt)>0) ru=Number(f.usdt);
  if(!rb){var x=rateOf(c.fecha,'bcv'); rb=x?x.v:0}
  if(!ru){var y=rateOf(c.fecha,'usdt'); ru=y?y.v:0}
  return {rb:rb,ru:ru};
}
/* comisión fija por cada cambio de USDT a Bs (por ejemplo, en Binance): se cuenta una vez por factura
   (o por compra suelta) y se reparte entre sus productos, sin mostrarla aparte */
var fxCache=null;
function fxReset(){fxCache=null}
function needsFx(c){return (c.moneda||'Bs')!=='USDT'}
function bsOfRow(c){var r=resolved(c),k=ratesFor(r);return convert(Number(c.cantidad)*Number(c.precio),c.moneda||'Bs',k.rb,k.ru).bs}
function fxMap(){
  if(fxCache) return fxCache;
  var m={};
  DATA.compras.forEach(function(c){
    if(!c.factura||!needsFx(c)||!facById(c.factura)) return;
    var b=bsOfRow(c); if(b>0) m[c.factura]=(m[c.factura]||0)+b;
  });
  return (fxCache=m);
}
function fxShare(c,bs,r){
  var fee=CFG.mon.feeUsdt; if(!(fee>0)||!needsFx(c)||!(r.ru>0)||!(bs>0)) return 0;
  if(!c.factura||!facById(c.factura)) return fee;
  var den=fxMap()[c.factura]; return den>0?fee*payCount(facById(c.factura))*bs/den:0;
}
function calc(c){
  var r=ratesFor(c),m=c.moneda||'Bs',q=Number(c.cantidad)||0;
  var tot=convert(q*Number(c.precio),m,r.rb,r.ru),uni=convert(Number(c.precio),m,r.rb,r.ru);
  var fx=fxShare(c,tot.bs,r);
  if(fx>0&&tot.usdt!=null){tot.usdt+=fx; if(q>0&&uni.usdt!=null) uni.usdt+=fx/q}
  return {bs:tot.bs,bcv:tot.bcv,usdt:tot.usdt,uBs:uni.bs,uBcv:uni.bcv,uUsdt:uni.usdt};
}
function withK(c){return Object.assign({},c,{k:calc(c)})}

  var R=40,C=2*Math.PI*R,acc=0,w=18,segs='';
  list.forEach(function(it){
    var f=total>0?it.v/total:0,len=Math.max(0,f*C-(list.length>1?2:0));
    segs+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+esc(cc(it.color))+'" stroke-width="'+w+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    acc+=f;
  });
  return '<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Gasto por categoría, total '+esc(fmt(total)+' '+cname(DC()))+'"><circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--surface2)" stroke-width="'+w+'"/>'+segs+'<text class="ch-big" x="60" y="62" text-anchor="middle">'+esc(fmt(total))+'</text><text class="ch-sm" x="60" y="74" text-anchor="middle">'+esc(cname(DC()))+'</text></svg>';
}

/* ---------- sincronización cifrada con un gist de GitHub ---------- */
var TE=new TextEncoder(),TD=new TextDecoder();
var idb=null,idbOk=false;
function idbOpen(){return new Promise(function(res){try{var q=indexedDB.open('cdm',1);q.onupgradeneeded=function(){var d=q.result;if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta')};q.onsuccess=function(){idb=q.result;idbOk=true;res(true)};q.onerror=function(){res(false)};q.onblocked=function(){res(false)}}catch(e){res(false)}})}
function idbReq(store,mode,fn){return new Promise(function(res,rej){if(!idb) return rej(new Error('idb'));try{var t=idb.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=function(){res(r&&r.result)};t.onerror=t.onabort=function(){rej(t.error||new Error('idb'))}}catch(e){rej(e)}})}
var idbGet=function(s,k){return idbReq(s,'readonly',function(o){return o.get(k)})};
var idbPut=function(s,v,k){return idbReq(s,'readwrite',function(o){return k===undefined?o.put(v):o.put(v,k)})};
var idbDel=function(s,k){return idbReq(s,'readwrite',function(o){return o.delete(k)})};
function b64e(buf){var u=buf instanceof Uint8Array?buf:new Uint8Array(buf),s='',n=0x8000;for(var i=0;i<u.length;i+=n) s+=String.fromCharCode.apply(null,u.subarray(i,i+n));return btoa(s)}
function b64d(str){var s=atob(str),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i);return u.buffer}
async function deriveKey(pass,saltB64,iter){
  var base=await crypto.subtle.importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(saltB64),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encBytes(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes);return JSON.stringify({v:1,iv:b64e(iv),ct:b64e(ct)})}
async function decBytes(key,text){var o=typeof text==='string'?JSON.parse(text):text;return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b64d(o.iv))},key,b64d(o.ct))}
function encJ(key,obj){return encBytes(key,TE.encode(JSON.stringify(obj)))}
async function decJ(key,text){return JSON.parse(TD.decode(await decBytes(key,text)))}
async function loadKey(){
  if(SYNC.key) return SYNC.key;
  try{var k=await idbGet('meta','key'); if(k) SYNC.key=k}catch(e){}
  return SYNC.key;
}
async function gh(method,path,body,extra){
  var h=Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+syncCfg().token},extra||{});
  if(body) h['Content-Type']='application/json';
  try{return await fetch('https://api.github.com'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'})}
  catch(e){var er=new Error('Sin conexión');er.code='net';throw er}
}
async function rawText(url){
  try{var r=await fetch(url,{cache:'no-store'});if(!r.ok) throw new Error('raw');return await r.text()}
  catch(e){var er=new Error('Sin conexión');er.code='net';throw er}
}
function httpErr(r){
  var e=new Error(r.status===401?'El token no es válido o venció':r.status===403?'GitHub rechazó la petición (permiso o límite de uso)':r.status===404?'No se encontró el gist: revisa el ID y que el token tenga el permiso Gists':'Error de GitHub ('+r.status+')');
  e.code='http'+r.status; return e;
}
function scheduleSync(ms){if(!SYNC.on) return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(function(){syncNow(false)},ms||0)}
function redrawSync(){if(tab==='ajustes'&&ajTab==='nube'&&overlay.hidden) render()}
function hora(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}

/* nombres de los archivos que este dispositivo tiene datos para subir */
function localFileNames(){
  var n={}; if(CFGUPD>0) n['cfg.json']=1;
  COLS.forEach(function(col){
    DATA[col].forEach(function(r){n[fileOf(col,r)]=1});
    Object.keys(TOMB[col]).forEach(function(id){var f=TOMB[col][id].f; if(f) n[f]=1});
  });
  return Object.keys(n);
}
/* mezcla los registros de un archivo remoto: gana el cambio más reciente (campo upd) de cada registro */
function mergeList(col,remote,fname){
  var local=DATA[col],changed=false,rIds={},tomb=TOMB[col];
  var idxOf=function(id){for(var i=0;i<local.length;i++) if(local[i].id===id) return i;return -1};
  remote.forEach(function(r){
    if(!r||!r.id) return; rIds[r.id]=1;
    var i=idxOf(r.id),t=tomb[r.id],ru=Number(r.upd)||0;
    var lu=i>-1?(Number(local[i].upd)||0):(t?(Number(t.upd)||0):-1);
    if(ru>lu){
      if(r.del){ if(i>-1) local.splice(i,1); tomb[r.id]={upd:ru,f:fname} }
      else{ var rec=Object.assign({},r); delete rec.del; if(i>-1){ if(fileOf(col,local[i])!==fname) markDirty(fileOf(col,local[i])); local[i]=rec } else local.push(rec); delete tomb[r.id] }
      changed=true;
    }else if(ru<lu){ markDirty(fname) }
    else if(i>-1&&fileOf(col,local[i])!==fname){ markDirty(fname) }
  });
  local.forEach(function(l){if(fileOf(col,l)===fname&&!rIds[l.id]) markDirty(fname)});
  Object.keys(tomb).forEach(function(id){if(tomb[id].f===fname&&!rIds[id]) markDirty(fname)});
  return changed;
}
async function mergeRemote(key,files){
  var changed=false,names=Object.keys(files);
  for(var i=0;i<names.length;i++){
    var name=names[i],f=files[name];
    if(name==='meta.json'||name==='LEEME.txt') continue;
    M.size[name]=f.size||0;
    if(M.raw[name]===f.raw_url) continue;
    var text=f.truncated?await rawText(f.raw_url):f.content;
    try{
      if(name==='cfg.json'){
        var o=await decJ(key,text),ou=Number(o.upd)||0;
        if(ou>CFGUPD){CFG=normalizeCfg(o.cfg);CFGUPD=ou;changed=true}
        else if(ou<CFGUPD) markDirty('cfg.json');
      }else{
        var col=name==='catalogo.json'?'catalogo':name==='tasas.json'?'tasas':name==='facturas.json'?'facturas':/^compras-\d{4}\.json$/.test(name)?'compras':null;
        if(col&&mergeList(col,await decJ(key,text),name)) changed=true;
      }
    }catch(e){
      if(e&&e.code==='net') throw e;
      var er=new Error('No se pudo descifrar “'+name+'”. ¿La contraseña es la misma en todos los dispositivos?');er.code='dec';throw er;
    }
    M.raw[name]=f.raw_url;
  }
  Object.keys(M.raw).forEach(function(n){if(!files[n]){delete M.raw[n];delete M.size[n]}});
  localFileNames().forEach(function(n){if(!files[n]) markDirty(n)});
  if(changed) lsSave();
  return changed;
}
async function pushDirty(key){
  var out={},taken=[],names=M.dirty.slice();
  for(var i=0;i<names.length;i++){
    var n=names[i];
    M.dirty=M.dirty.filter(function(x){return x!==n});taken.push(n);
    if(n==='cfg.json'){ if(CFGUPD>0) out[n]={content:await encJ(key,{cfg:CFG,upd:CFGUPD})} }
    else{
      var col=n==='catalogo.json'?'catalogo':n==='tasas.json'?'tasas':n==='facturas.json'?'facturas':/^compras-\d{4}\.json$/.test(n)?'compras':null;
      if(!col) continue;
      var arr=DATA[col].filter(function(r){return fileOf(col,r)===n}).slice();
      Object.keys(TOMB[col]).forEach(function(id){var t=TOMB[col][id]; if(t.f===n) arr.push({id:id,del:1,upd:t.upd})});
      if(arr.length) out[n]={content:await encJ(key,arr)}; else if(M.raw[n]) out[n]=null;
    }
  }
  if(!Object.keys(out).length){msSave();return}
  var r=await gh('PATCH','/gists/'+syncCfg().gist,{files:out});
  if(!r.ok){taken.forEach(markDirty);throw httpErr(r)}
  var j=await r.json();
  Object.keys(out).forEach(function(nm){
    if(out[nm]===null){delete M.raw[nm];delete M.size[nm];return}
    var f=j.files&&j.files[nm];if(f){M.raw[nm]=f.raw_url;M.size[nm]=f.size||0}
  });
  M.etag='';msSave();
}
async function syncNow(manual){
  if(!SYNC.on) return;
  if(SYNC.busy){SYNC.again=true;return}
  if(navigator.onLine===false&&!manual) return;
  SYNC.busy=true;SYNC.st='sync';paintStatus();redrawSync();
  try{
    var key=await loadKey();
    if(!key){SYNC.st='pass';var se=new Error('pass');se.silent=true;throw se}
    var r=await gh('GET','/gists/'+syncCfg().gist,null,(M.etag&&!M.dirty.length)?{'If-None-Match':M.etag}:{}),changed=false;
    if(r.status!==304){
      if(!r.ok) throw httpErr(r);
      var j=await r.json();M.etag=r.headers.get('ETag')||'';
      changed=await mergeRemote(key,j.files||{});
    }
    await pushDirty(key);
    M.last=Date.now();SYNC.st='ok';SYNC.err='';
    if(changed) render();
  }catch(e){
    if(!e||!e.silent){SYNC.st='error';SYNC.err=e&&e.code==='net'?'Sin conexión: se enviará cuando haya internet':(e&&e.message)||'Error de sincronización'}
  }finally{
    SYNC.busy=false;msSave();paintStatus();redrawSync();
    if(SYNC.again){SYNC.again=false;scheduleSync(800)}
  }
}
function wireSync(){
  if(SYNC.wired) return;SYNC.wired=true;
  document.addEventListener('visibilitychange',function(){if(!document.hidden) scheduleSync(300)});
  window.addEventListener('online',function(){scheduleSync(500)});
  window.addEventListener('focus',function(){scheduleSync(300)});
  setInterval(function(){if(!document.hidden&&navigator.onLine!==false) scheduleSync(0)},45000);
}
function initSync(){
  var sc=syncCfg();SYNC.on=!!(sc.token&&sc.gist&&window.crypto&&crypto.subtle);
  if(!SYNC.on){paintStatus();return}
  SYNC.st='ok';wireSync();scheduleSync(500);paintStatus();
}
/* los registros anteriores a la nube no tienen fecha de cambio: se les pone una para que puedan mezclarse */
function stampAll(){
  COLS.forEach(function(col){DATA[col].forEach(function(r){if(!r.upd) r.upd=Number(r.creado)||1})});
}
async function syncConnect(){
  var err=$('#sync-err'),fail=function(m){err.textContent=m;err.hidden=false};
  err.hidden=true;
  var token=$('#sync-token').value.trim(),pass=$('#sync-pass').value,gist=$('#sync-gist').value.trim();
  if(!token) return fail('Pega tu token de GitHub.');
  if(pass.length<6) return fail('La contraseña debe tener al menos 6 caracteres.');
  if(!(window.crypto&&crypto.subtle)) return fail('Este navegador no permite el cifrado. Abre la app desde su dirección https.');
  if(!idbOk) return fail('Este navegador no deja guardar la clave de cifrado (¿modo privado?). Ábrela en una ventana normal.');
  if(gist){var m=gist.match(/[0-9a-fA-F]{20,40}/g);gist=m?m[m.length-1]:gist.replace(/[^0-9a-zA-Z]/g,'')}
  toast('Conectando…');
  var prev=syncCfg(),fresh=!gist;
  try{
    syncCfgSave({token:token,gist:''});
    var key;
    if(gist){
      var r=await gh('GET','/gists/'+gist);if(!r.ok) throw httpErr(r);
      var j=await r.json(),mf=j.files&&j.files['meta.json'];if(!mf) throw new Error('Ese gist no es de Compras del Mes.');
      var meta=JSON.parse(mf.truncated?await rawText(mf.raw_url):mf.content);
      if(meta.app!=='compras-del-mes') throw new Error('Ese gist no es de Compras del Mes.');
      key=await deriveKey(pass,meta.salt,meta.iter||250000);
      var okc=false;try{okc=TD.decode(await decBytes(key,meta.chk))==='ok'}catch(e){}
      if(!okc) throw new Error('La contraseña no coincide con la de ese gist.');
    }else{
      var salt=b64e(crypto.getRandomValues(new Uint8Array(16)));key=await deriveKey(pass,salt,250000);
      var meta2={app:'compras-del-mes',v:1,salt:salt,iter:250000,chk:await encBytes(key,TE.encode('ok'))};
      var r2=await gh('POST','/gists',{description:'Compras del Mes (datos cifrados)',public:false,files:{'meta.json':{content:JSON.stringify(meta2)},'LEEME.txt':{content:'Datos cifrados de Compras del Mes. No borres ni edites estos archivos.'}}});
      if(!r2.ok) throw httpErr(r2);
      gist=(await r2.json()).id;
    }
    await idbPut('meta',key,'key');
    M.raw={};M.etag='';M.size={};
    stampAll();
    if(fresh&&CFGUPD===0) CFGUPD=Date.now();
    localFileNames().forEach(markDirty);
    lsSave();
    SYNC.key=key;
    syncCfgSave({token:token,gist:gist});SYNC.on=true;SYNC.st='ok';SYNC.err='';
    msSave();wireSync();render();toast('Conectado');syncNow(true);
  }catch(e){
    syncCfgSave(prev&&prev.gist?prev:null);
    fail(e&&e.code==='net'?'Sin conexión.':(e&&e.message)||'No se pudo conectar.');
  }
}
async function syncPassGo(){
  var el=$('#sync-pass2'),err=$('#sync-err'),pass=el?el.value:'';
  var fail=function(m){err.textContent=m;err.hidden=false};
  if(err) err.hidden=true; if(!pass) return fail('Escribe la contraseña.');
  try{
    var r=await gh('GET','/gists/'+syncCfg().gist);if(!r.ok) throw httpErr(r);
    var j=await r.json(),mf=j.files&&j.files['meta.json'];if(!mf) throw new Error('Ese gist no es de Compras del Mes.');
    var meta=JSON.parse(mf.truncated?await rawText(mf.raw_url):mf.content),key=await deriveKey(pass,meta.salt,meta.iter||250000),okc=false;

}
async function syncOff(){

}
function ajNube(){

    h+='<section class="card"><h2>Conectado</h2><p class="hint" style="margin-bottom:10px"><b>Estado:</b> '+est+'<br><b>Última vez:</b> '+(M.last?esc(dateShort(ymd(new Date(M.last))))+' '+hora(M.last):'—')+'</p>'+

/* ---------- copias de seguridad ---------- */
function buildBackup(){
  return JSON.stringify({app:'compras-del-mes',v:2,fecha:ymd(NOW),cfg:CFG,compras:DATA.compras,catalogo:DATA.catalogo,tasas:DATA.tasas,facturas:DATA.facturas},null,1);
}
async function saveFile(name,text){
  try{
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl) return false;
    await dl.save({filename:name,data:text}); toast('Archivo listo'); return true;
  }catch(e){ return !!(e&&e.code==='declined'); }
}
function showBox(text){var b=$('#export-box'); if(!b) return; b.hidden=false; b.value=text; b.focus(); b.select()}
async function exportFile(){
  var txt=buildBackup();
  if(!(await saveFile('compras-del-mes-'+ymd(NOW)+'.json',txt))){showBox(txt);toast('Copia lista abajo: cópiala y guárdala en un archivo')}
}
async function exportCopy(){
  var txt=buildBackup();
  try{await navigator.clipboard.writeText(txt);toast('Datos copiados')}catch(e){showBox(txt)}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCsv(){
  var rows=monthRows(curKey).sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0)});
  var n2=function(v){return v==null?'':String(Math.round(v*100)/100)};
  var out=[['Fecha','Comprador','Categoría','Producto','Cantidad','Unidad','Precio','Moneda del precio','Total '+CFG.mon.bs,'Total '+CFG.mon.bcv,'Total '+CFG.mon.usdt,'Lugar','Nota']];
  rows.forEach(function(r){out.push([r.fecha,buyerById(r.comprador).nombre,catById(r.cat).nombre,r.item,r.cantidad,r.unidad,r.precio,cname(r.moneda||'Bs'),n2(r.k.bs),n2(r.k.bcv),n2(r.k.usdt),r.lugar||'',r.nota||''])});
  var txt='﻿'+out.map(function(l){return l.map(csvCell).join(',')}).join('\r\n');
  if(!(await saveFile('compras-'+curKey+'.csv',txt))){showBox(txt);toast('Tabla lista abajo: cópiala')}
}
async function restore(){
  var err=$('#restore-err'),fail=function(m){err.textContent=m;err.hidden=false};
  err.hidden=true;
  var f=$('#restore-file').files&&$('#restore-file').files[0],text=$('#restore-text').value.trim();
  try{
    if(f) text=await f.text();
    if(!text) return fail('Elige el archivo de copia o pega su contenido.');
    var o=JSON.parse(text);
    if(!o||o.app!=='compras-del-mes') return fail('Ese archivo no es una copia de Compras del Mes.');
  }catch(e){return fail('No se pudo leer la copia. Revisa que esté completa.')}
  try{
    setStatus('saving'); toast('Restaurando…');
    bulk=true;
    CFG=normalizeCfg(o.cfg); saveCfg();
    var cols=['catalogo','tasas','facturas','compras'];
    for(var i=0;i<cols.length;i++){
      var arr=Array.isArray(o[cols[i]])?o[cols[i]]:[];
      for(var j=0;j<arr.length;j++){var it=arr[j]; if(!it||!it.id) continue; var rest=Object.assign({},it); delete rest.id; await dbSet(cols[i],String(it.id),rest)}
    }
    bulk=false; lsSave(); afterChange();
    setStatus('ok'); render(); toast('Copia restaurada');
  }catch(e){bulk=false; if(!Store.db) lsSave(); setStatus('error'); fail('No se pudo restaurar todo: '+dbMsg(e))}
}
function dbMsg(e){
  var c=e&&e.code;
  if(c==='invalid_argument') return 'No tienes permiso para guardar aquí. Pide a quien te compartió la app que te dé acceso de colaborador.';
  if(c==='quota_exceeded') return 'Se llenó el espacio de almacenamiento de la app.';
  if(c==='revoked') return 'Se perdió el acceso a los datos. Recarga la página.';
  return 'No se pudo guardar. Intenta de nuevo.';
}

var overlay=$('#overlay'), sheet=$('#sheet');
function openSheet(html,init){
  sheet.innerHTML=html; overlay.hidden=false; document.body.classList.add('lock'); sheet.scrollTop=0;
  if(init) init(sheet);
}
function closeSheet(){overlay.hidden=true;sheet.innerHTML='';document.body.classList.remove('lock')}
overlay.addEventListener('mousedown',function(e){if(e.target===overlay) closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden) closeSheet()});
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}
function showErr(msg){var e=sheet.querySelector('#err');if(e){e.textContent=msg;e.hidden=false}}
function confirmTap(el,label,fn){
  if(!el.dataset.sure){ el.dataset.sure='1'; var old=el.innerHTML; el.textContent=label; setTimeout(function(){if(el.isConnected){delete el.dataset.sure;el.innerHTML=old}},3200); return }
  fn();
}
function swatchBlock(sel){
  return '<div class="fld"><span>Color</span><div class="sw-grid" id="sw">'+COL_SW.map(function(c){return '<button type="button" class="sw-btn'+(c.toLowerCase()===sel.toLowerCase()?' on':'')+'" style="background:'+c+'" data-col="'+c+'" aria-label="Color '+c+'"></button>'}).join('')+'<input type="color" id="swc" value="'+esc(sel)+'" aria-label="Elegir otro color"></div></div>';
}
function bindSwatches(s,get,set){
  var box=s.querySelector('#sw'),pick=s.querySelector('#swc');
  function sync(){var c=get().toLowerCase();pick.value=c;$$('.sw-btn',box).forEach(function(b){b.classList.toggle('on',b.dataset.col.toLowerCase()===c)})}
  box.addEventListener('click',function(e){var b=e.target.closest('[data-col]');if(b){set(b.dataset.col);sync()}});
  pick.addEventListener('input',function(){set(pick.value);sync()});
}

  var rb=rateOf(date,'bcv'),ru=rateOf(date,'usdt'),ex=exactTasa(date),inh=[];
  if(CFG.mon.showBcv&&rb&&rb.f!==date) inh.push(CFG.mon.bcv+' del '+dateShort(rb.f));
  if(CFG.mon.showUsdt&&ru&&ru.f!==date) inh.push(CFG.mon.usdt+' del '+dateShort(ru.f));
  openSheet('<form id="f" novalidate><h2>Tasa del '+esc(dateLong(date))+'</h2>'+
    '<p class="hint">Cuántos Bs vale 1 '+esc(CFG.mon.showBcv?CFG.mon.bcv:'')+(CFG.mon.showBcv&&CFG.mon.showUsdt?' y 1 ':'')+esc(CFG.mon.showUsdt?CFG.mon.usdt:'')+' ese día. Se usa en todas las compras de esa fecha: si la cambias, sus montos se recalculan.</p>'+

    (CFG.mon.showUsdt?'<label class="fld grow"><span>Tasa '+esc(CFG.mon.usdt)+' (Bs)</span><input type="text" inputmode="decimal" name="tusdt" value="'+(ru?esc(numStr(ru.v)):'')+'" placeholder="0,00" autocomplete="off"></label>':'')+'</div>'+
    '<p class="err" id="err" role="alert" hidden></p>'+
    '<div class="actions"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-a="close">Cancelar</button></div>'+
    (ex?'<button class="btn danger" type="button" id="del">Quitar la tasa de este día</button>':'')+'</form>',
  function(s){
    var form=s.querySelector('#f');
    form.addEventListener('submit',function(e){
      e.preventDefault();

      var hb=form.elements.tbcv&&form.elements.tbcv.value.trim()!=='',hu=form.elements.tusdt&&form.elements.tusdt.value.trim()!=='';

    });

      var u=unitNow(),mo=form.elements.moneda.value,tot=modoNow()==='total';
      s.querySelector('#f-un').textContent='('+u+')';
      s.querySelector('#f-mu').textContent='Precio por '+unitName(u);
      s.querySelector('#f-pl').textContent=tot?'Total pagado ('+cname(mo)+')':'Precio por '+unitName(u)+' ('+cname(mo)+')';
      var c=parseNum(inp('cantidad').value),pe=priceNow(),pv=s.querySelector('#f-prev');
      if(c>0&&pe>0){
        var r=ratesNow(),cv=convert(c*pe,mo,r.rb,r.ru),parts=[];
        if(cv.usdt!=null&&mo!=='USDT'&&CFG.mon.feeUsdt>0&&r.ru>0&&cv.bs>0){
          var fee=CFG.mon.feeUsdt*(fac?payCount(fac):1),den=cv.bs;
          if(fac){DATA.compras.forEach(function(x){if(x.factura===fac.id&&(!ex||x.id!==ex.id)&&needsFx(x)){var bb=bsOfRow(x);if(bb>0) den+=bb}})}
          cv.usdt+=fee*cv.bs/den;
        }
        monList.forEach(function(k){var v=k==='BCV'?cv.bcv:k==='USDT'?cv.usdt:cv.bs;parts.push(esc(cname(k))+' '+(v==null?'<span class="warnx">falta tasa</span>':'<span class="num">'+fmt(v)+'</span>'))});
        pv.innerHTML=(tot?'Sale a <span class="num">'+fmt(pe)+'</span> '+esc(cname(mo))+' por '+esc(unitName(u))+'<br>':'')+'Total: '+parts.join(' · ');
      }else pv.textContent='Escribe cantidad y precio para ver el total en '+monList.map(cname).join(', ')+'.';
    }
    form.addEventListener('click',function(e){
      var b=e.target.closest('[data-f]'); if(!b) return;
      if(b.dataset.f==='cat'){st.cat=b.dataset.id;upd()}
      else if(b.dataset.f==='pick'){var it=DATA.catalogo.filter(function(i){return i.id===b.dataset.id})[0];if(it){inp('producto').value=it.nombre;upd();inp('cantidad').focus()}}
    });
    form.addEventListener('input',function(e){
      var n=e.target.name; if(n==='tbcv'||n==='tusdt') st.touched=true;
      upd();
    });
    form.addEventListener('change',function(e){if(e.target.name==='fecha'){fillRates(false);upd()} else upd()});
    fillRates(true); upd();
    async function go(addMore){
      if(st.busy) return; var eb=s.querySelector('#err'); eb.hidden=true;
      var v=Object.fromEntries(new FormData(form)),tot=modoNow()==='total';
      var fecha=v.fecha,name=(v.producto||'').trim(),c=parseNum(v.cantidad),p=parseNum(v.precio),m=matchItem(),mo=v.moneda||'Bs';
      if(!validDate(fecha)) return showErr('Elige la fecha de la compra.');
      if(!name) return showErr('Escribe o elige el producto.');
      if(!(c>0)) return showErr('La cantidad debe ser mayor que cero.');
      if(!(p>0)) return showErr(tot?'Escribe el total pagado por este producto.':'Escribe el precio por '+unitName(unitNow())+'.');
      var r=ratesNow(),det=s.querySelector('#f-rates');
      if(mo==='BCV'&&!(r.rb>0)){if(det) det.open=true;return showErr(fac?'Esta factura no tiene tasa '+CFG.mon.bcv+'. Cierra, toca “Editar factura” y escríbela.':'Para precios en '+CFG.mon.bcv+' escribe la tasa del día.')}
      if(mo==='USDT'&&!(r.ru>0)){if(det) det.open=true;return showErr(fac?'Esta factura no tiene tasa '+CFG.mon.usdt+'. Cierra, toca “Editar factura” y escríbela.':'Para precios en '+CFG.mon.usdt+' escribe la tasa del día.')}
      var unidad=m?m.unidad:(v.unidad||CFG.unidades[0]),precio=tot?Number((p/c).toFixed(8)):p;
      st.busy=true; $$('button',s).forEach(function(b){b.disabled=true});
      try{
        if(!fac){
          var exT=exactTasa(fecha);
          if((r.rb>0||r.ru>0)&&(!exT||Number(exT.bcv||0)!==r.rb||Number(exT.usdt||0)!==r.ru)) await dbSet('tasas',fecha,{fecha:fecha,bcv:r.rb>0?r.rb:null,usdt:r.ru>0?r.ru:null});
        }
        var unchanged=ex&&ex.item===name&&ex.cat===st.cat;
        if(!m&&!unchanged) await dbAdd('catalogo',{cat:st.cat,nombre:name,unidad:unidad});
        var rec={fecha:fac?fac.fecha:fecha,cat:st.cat,item:name,unidad:unidad,cantidad:c,precio:precio,moneda:mo,comprador:fac?fac.comprador:v.comprador,lugar:fac?(fac.lugar||''):(v.lugar||'').trim(),nota:(v.nota||'').trim(),creado:(ex&&ex.creado)||Date.now()};
        if(fac) rec.factura=fac.id;
        if(ex) await dbSet('compras',ex.id,rec); else await dbAdd('compras',rec);
        if(!fac) prefSet('who',v.comprador); prefSet('mon',mo); prefSet('modo',v.modo==='total'?'total':'unit');
        if(rec.fecha.slice(0,7)!==curKey) curKey=rec.fecha.slice(0,7);
        if(addMore){render();sheetCompra(null,fac?{factura:fac.id,cat:st.cat,moneda:mo,modo:v.modo==='total'?'total':'unit'}:{fecha:fecha,comprador:v.comprador,lugar:rec.lugar,cat:st.cat,moneda:mo,modo:v.modo==='total'?'total':'unit'});toast(fac?'Agregado. Siguiente producto.':'Guardada. Agrega la siguiente.')}
        else{closeSheet();render();toast(ex?'Cambios guardados':(fac?'Producto agregado':'Compra guardada'))}
      }catch(er){
        st.busy=false; $$('button',s).forEach(function(b){b.disabled=false}); showErr(dbMsg(er));
      }
    }
    form.addEventListener('submit',function(e){e.preventDefault();go(seguir)});
    var bm=s.querySelector('#b-more'); if(bm) bm.addEventListener('click',function(){go(!seguir)});
    var dup=s.querySelector('#b-dup'); if(dup) dup.addEventListener('click',function(){sheetCompra(null,{fecha:d.fecha,comprador:d.comprador,cat:d.cat,item:d.item,unidad:d.unidad,cantidad:d.cantidad,precio:d.precio,moneda:d.moneda,lugar:d.lugar,nota:d.nota,factura:d.factura})});
    var del=s.querySelector('#b-del'); if(del) del.addEventListener('click',function(){confirmTap(del,'Toca otra vez para eliminar',function(){dbDel('compras',ex.id).then(function(){closeSheet();toast('Eliminado')}).catch(function(er){showErr(dbMsg(er))})})});
  });
}

/* ---------- eventos ---------- */
function mover(arr,id,d){var i=arr.findIndex(function(x){return (x&&x.id!==undefined?x.id:x)===id}),j=i+d;if(i<0||j<0||j>=arr.length) return false;var t=arr[i];arr[i]=arr[j];arr[j]=t;return true}
function setUI(k,v){UI[k]=v;uiSave();render()}
function goMonth(k){curKey=k;facView=null;render();window.scrollTo(0,0)}
function inUse(u){return DATA.catalogo.some(function(i){return i.unidad===u})||DATA.compras.some(function(c){return c.unidad===u})}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-a]'); if(!b) return;
  var a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  switch(a){
    case 'tab': tab=b.dataset.t; facView=null; render(); window.scrollTo(0,0); break;
    case 'prev': goMonth(addMonths(curKey,-1)); break;
    case 'next': goMonth(addMonths(curKey,1)); break;
    case 'hoy': goMonth(nowKey); break;
    case 'cur': displayCur=b.dataset.c; prefSet('cur',displayCur); render(); break;
    case 'fab': if(tab==='compras'&&facView&&facById(facView)) sheetCompra(null,{factura:facView}); else sheetNuevo(); break;
    case 'new-fac': sheetFactura(); break;
    case 'new-loose': sheetCompra(); break;
    case 'fac': facView=id; tab='compras'; render(); window.scrollTo(0,0); break;
    case 'fac-back': facView=null; render(); window.scrollTo(0,0); break;
    case 'fac-edit': sheetFactura(id); break;
    case 'fac-add': sheetCompra(null,{factura:id}); break;
    case 'compra': sheetCompra(id); break;
    case 'tasa': sheetTasa(b.dataset.d); break;
    case 'close': closeSheet(); break;
    case 'f-who': filt.who=b.dataset.c; render(); break;
    case 'f-cat': filt.cat=b.dataset.c; render(); break;
    case 'ver-prod': busq=b.dataset.q; filt.cat='todas'; facView=null; tab='compras'; render(); window.scrollTo(0,0); break;
    case 'dia': var rd=$('#dread'); if(rd){rd.innerHTML=b.dataset.t;$$('.dbar.sel').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')} break;
    case 'welcome-no': CFG.setup=true; saveCfg(); render(); break;
    case 'go-aj': if(b.dataset.setup){CFG.setup=true;saveCfg()} tab='ajustes'; ajTab=v; render(); window.scrollTo(0,0); break;
    case 'atab': ajTab=v; render(); break;
    /* categorías, productos, unidades, compradores */
    case 'new-cat': sheetCat(); break;
    case 'cat': sheetCat(id); break;
    case 'cat-up': if(mover(CFG.categorias,id,-1)){saveCfg();render()} break;
    case 'cat-down': if(mover(CFG.categorias,id,1)){saveCfg();render()} break;
    case 'item': sheetItem(id); break;
    case 'new-pago': sheetPago(); break;
    case 'pago': sheetPago(id); break;
    case 'pago-up': if(mover(CFG.pagos,id,-1)){saveCfg();render()} break;
    case 'pago-down': if(mover(CFG.pagos,id,1)){saveCfg();render()} break;
    case 'cuota':
      var cf=facById(id); if(!cf) break;
      var pg=Array.isArray(cf.pagadas)?cf.pagadas.slice():[],kx=pg.indexOf(b.dataset.k);
      if(kx>-1) pg.splice(kx,1); else pg.push(b.dataset.k);
      var cr=Object.assign({},cf,{pagadas:pg}); delete cr.id;
      cf.pagadas=pg; render();
      dbSet('facturas',id,cr).catch(function(er){toast(dbMsg(er))});
      break;
    case 'new-buyer': sheetBuyer(); break;
    case 'buyer': sheetBuyer(id); break;
    case 'buyer-up': if(mover(CFG.buyers,id,-1)){saveCfg();render()} break;
    case 'buyer-down': if(mover(CFG.buyers,id,1)){saveCfg();render()} break;
    case 'unit-del':
      var u=b.dataset.u;
      if(CFG.unidades.length<2) toast('Debe quedar al menos una unidad');
      else if(inUse(u)) toast('“'+u+'” tiene productos o compras, no se puede quitar');
      else {CFG.unidades=CFG.unidades.filter(function(x){return x!==u});saveCfg();render()}
      break;
    case 'unit-preset': if(CFG.unidades.indexOf(b.dataset.u)<0&&CFG.unidades.length<12){CFG.unidades.push(b.dataset.u);saveCfg();render()} break;
    /* monedas */
    case 'num-dec': CFG.mon.dec=Number(v); saveCfg(); render(); break;
    case 'num-sep': CFG.mon.sep=v; saveCfg(); render(); break;
    /* resumen */
    case 'vista': CFG.resumen.vista=v; if(v==='personal') personalDesde('personal'); saveCfg(); render(); break;
    case 'vista-custom': var cur=CFG.resumen.vista; CFG.resumen.vista='personal'; personalDesde(cur); saveCfg(); render(); break;
    case 'rs-cat': CFG.resumen.cat=v; saveCfg(); render(); break;
    case 'rs-stat':
      var ix=CFG.resumen.stats.indexOf(id);
      if(ix>-1){if(CFG.resumen.stats.length>1) CFG.resumen.stats.splice(ix,1)}
      else CFG.resumen.stats=STAT_IDS.filter(function(x){return x===id||CFG.resumen.stats.indexOf(x)>-1});
      saveCfg(); render(); break;
    case 'blq-up': ordenFix(); if(mover(CFG.resumen.orden,id,-1)){saveCfg();render()} break;
    case 'blq-down': ordenFix(); if(mover(CFG.resumen.orden,id,1)){saveCfg();render()} break;
    /* apariencia */
    case 'ui-tema': setUI('tema',v); break;
    case 'ui-acento': setUI('acento',v); break;
    case 'ui-tono': setUI('tono',v); break;
    case 'ui-fuente': setUI('fuente',v); break;
    case 'ui-num': setUI('num',v); break;
    case 'ui-tam': setUI('tam',Number(v)); break;
    case 'ui-dens': setUI('dens',v); break;
    case 'ui-esq': setUI('esq',v); break;
    case 'ui-reset': UI=defaultUI(); uiSave(); render(); toast('Apariencia restablecida'); break;
    case 'txt-reset': CFG.txt={}; saveCfg(); render(); toast('Textos restablecidos'); break;
    /* datos */
    case 'export-file': exportFile(); break;
    case 'export-copy': exportCopy(); break;
    case 'export-csv': exportCsv(); break;
    case 'restore': confirmTap(b,'Toca otra vez para restaurar',restore); break;
    case 'sync-connect': syncConnect(); break;
    case 'sync-pass-go': syncPassGo(); break;
    case 'sync-now': syncNow(true); break;
    case 'sync-off': confirmTap(b,'Toca otra vez para desconectar',syncOff); break;
  }
});
document.addEventListener('mouseover',function(ev){
  var b=ev.target.closest&&ev.target.closest('.dbar'); if(!b) return;
  var rd=$('#dread'); if(rd&&b.dataset.t) rd.innerHTML=b.dataset.t;
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=el.dataset&&el.dataset.a;
  if(a==='show-bcv'){CFG.mon.showBcv=el.checked;saveCfg();render()}
  else if(a==='show-usdt'){CFG.mon.showUsdt=el.checked;saveCfg();render()}
  else if(a==='blq-vis'){ordenFix();var r=CFG.resumen,i=r.ocultos.indexOf(el.dataset.id);if(el.checked&&i>-1) r.ocultos.splice(i,1);else if(!el.checked&&i<0) r.ocultos.push(el.dataset.id);saveCfg();render()}
  else if(el.id==='ui-color'){UI.acento=el.value.toUpperCase();uiSave();render()}
  else if(el.dataset&&el.dataset.set&&el.dataset.set.indexOf('mon-')===0){render()}
  else if(el.dataset&&el.dataset.set==='txt'){render()}
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='q'){busq=el.value;renderLista();return}
  if(el.id==='ui-color'){UI.acento=el.value.toUpperCase();uiSave();applyUI();return}
  var s=el.dataset&&el.dataset.set; if(!s) return;
  if(s==='txt'){var k=el.dataset.k,t=el.value.trim().slice(0,40); if(t&&t!==DEF_TXT[k]) CFG.txt[k]=t; else delete CFG.txt[k]; saveCfg(); applyUI()}
  else if(s==='mon-feeUsdt'){var nf=parseNum(el.value); CFG.mon.feeUsdt=nf>0&&nf<=1000?nf:0; saveCfg()}
  else if(s.indexOf('mon-')===0){var f=s.slice(4),t2=el.value.trim().slice(0,10); CFG.mon[f]=t2||defaultConfig().mon[f]; saveCfg()}
});
document.addEventListener('submit',function(ev){
  var f=ev.target;
  if(f.classList.contains('add-item')){
    ev.preventDefault();
    var cat=f.dataset.cat,n=f.nombre.value.trim(),u=f.unidad.value; if(!n) return;
    if(DATA.catalogo.some(function(i){return i.cat===cat&&i.nombre.toLowerCase()===n.toLowerCase()})){toast('“'+n+'” ya está en '+catById(cat).nombre);return}
    dbAdd('catalogo',{cat:cat,nombre:n,unidad:u}).then(function(){toast('Producto agregado');f.nombre&&(f.nombre.value='')}).catch(function(e){toast(dbMsg(e))});
  }else if(f.classList.contains('add-unit')){
    ev.preventDefault();
    var nu=f.u.value.trim().slice(0,8); if(!nu) return;
    if(CFG.unidades.indexOf(nu)>-1){toast('Esa unidad ya existe');return}
    if(CFG.unidades.length>=12){toast('Máximo 12 unidades');return}
    CFG.unidades.push(nu); saveCfg(); render(); toast('Unidad agregada');
  }
});

/* ---------- arranque ---------- */
uiLoad(); applyUI(); render();
Store.init().then(async function(){
  if(Store.db) subscribe(); else {lsLoad(); await idbOpen(); ready=true; initSync()}
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
  setTimeout(function(){if(!ready){ready=true;render()}},15000);
});
window.addEventListener('pagehide',function(){if(!Store.db){lsSave();msSave()}});
})();
</script>
